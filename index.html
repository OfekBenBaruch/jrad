function toast(t){$('toastText').textContent=t;$('toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{$('toast').hidden=true},3500)}
function coPatch(id,patch){
  coPend[id]=Object.assign(coPend[id]||{},patch);
  const t=cos.find(x=>x.id===id);if(t)Object.assign(t,patch);
  if(!db){render();return}
  chain=chain.then(()=>db.collection('companies').doc(id).update(patch))
    .then(()=>{const p=coPend[id];if(p){let same=true;for(const k in patch)if(p[k]!==patch[k])same=false;if(same)delete coPend[id]}toast('נשמר')})
    .catch(()=>{delete coPend[id];toast('השמירה נכשלה')});
  render();
}
function queue(fn){chain=chain.then(fn).catch(e=>toast('השמירה נכשלה: '+((e&&e.message)||'שגיאה')));return chain}

const jfield=(j,f)=>f==='appliedAt'?appDate(j):j[f];
function dayCounts(field,n){const out=[];for(let d=n-1;d>=0;d--){const dt=new Date(Date.now()-d*864e5).toLocaleDateString('en-CA');out.push(jobs.filter(j=>jfield(j,field)===dt).length)}return out}
function mini(a){const mx=Math.max(1,...a);return '<span class="mini" aria-hidden="true">'+a.map(v=>'<i style="height:'+Math.max(8,Math.round(v/mx*100))+'%;opacity:'+(v?1:.35)+'"></i>').join('')+'</span>'}
function areaChart(){
  const n=14,a=dayCounts('addedAt',n),mx=Math.max(2,...a),W=640,H=170,L=26,R=10,T=14,B=26,iw=W-L-R,ih=H-T-B;
  const pts=a.map((v,i)=>[L+iw*i/(n-1),T+ih-ih*v/mx]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const fill=line+' L'+(L+iw)+' '+(T+ih)+' L'+L+' '+(T+ih)+' Z';
  const grid=[0,.5,1].map(f=>{const y=T+ih-ih*f;return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(mx*f)+'</text>'}).join('');
  const lbl=pts.map((p,i)=>(i%2===(n-1)%2)?'<text x="'+p[0]+'" y="'+(H-8)+'" text-anchor="middle">'+new Date(Date.now()-(n-1-i)*864e5).toLocaleDateString('en-CA').slice(8,10)+'</text>':'').join('');
  const last=pts[n-1];
  return '<svg class="area" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="משרות שנוספו ב-14 הימים האחרונים"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa3ff" stop-opacity=".55"/><stop offset="1" stop-color="#11b5b0" stop-opacity=".06"/></linearGradient></defs>'+grid+'<path d="'+fill+'" fill="url(#ag)"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="5" fill="var(--accent)" stroke="var(--card2)" stroke-width="2"/>'+lbl+'</svg>';
}

function bHideSet(key){bHide[key]=1;try{localStorage.setItem('jr-bhide',JSON.stringify({d:today(),m:bHide}))}catch(e){}}
function briefAct(spec,dir){
  const [kind,id,k]=spec.split(':'), t=today(), tm=new Date(Date.now()+864e5).toLocaleDateString('en-CA');
  if(kind==='c'){coPatch(id,k==='due'&&dir==='l'?{nextDate:tm}:{nextDate:'',nextStep:'',updatedAt:new Date().toISOString()});return}
  const j=jobs.find(x=>x.id===id);if(!j)return;
  let patch;
  if(k==='due')patch=dir==='r'?{nextDate:'',nextStep:''}:{nextDate:tm};
  else if(dir==='r')patch={stage:'applied',appliedAt:t,reached:Math.max(reached(j),IDX.applied),history:(j.history||[]).concat([{d:t,s:'applied'}])};
  else patch={stage:'closed',history:(j.history||[]).concat([{d:t,s:'closed'}])};
  patch.updatedAt=new Date().toISOString();
  Object.assign(j,patch);render();
  if(db)queue(()=>db.doc('jobs/'+id).update(patch)).then(()=>toast(dir==='r'?(k==='due'?'סומן כבוצע':'נרשם כהוגש'):(k==='due'?'נדחה למחר':'נסגר')));
}
function briefHtml(){
  const t=today(), items=[];
  const dueJ=jobs.filter(j=>j.nextDate&&j.nextDate<=t&&j.stage!=='closed');
  const dueC=cos.filter(c=>c.nextDate&&c.nextDate<=t&&c.status!=='פסול'&&c.status!=='נסגר');
  dueJ.forEach(j=>items.push({k:'due',id:j.id,kind:'j',
    t:(j.nextStep||'מעקב')+' — '+(j.title||''),s:(j.company||'')+' · '+(j.nextDate<t?'באיחור מ-'+fd(j.nextDate):'להיום')}));
  dueC.forEach(c=>items.push({k:'due',id:c.id,kind:'c',
    t:(c.nextStep||'מעקב')+' — '+(c.name||''),s:(c.location||'')+' · '+(c.nextDate<t?'באיחור מ-'+fd(c.nextDate):'להיום')}));
  jobs.filter(j=>j.stage==='found').sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,3)
    .forEach(j=>{const dp=dupOf(j);items.push({k:'new',id:j.id,kind:'j',t:'להגיש — '+(j.title||''),
      s:(j.company||'')+(j.location?' · '+j.location:'')+(j.score?' · ציון '+j.score:'')+(dp?' · ⚠ אותה משרה כמו אצל '+(dp.company||'')+(reached(dp)>=IDX.applied?' — כבר הגשת':''):'')})});
  const list=items.filter(i=>!bHide[i.kind+':'+i.id]).slice(0,5);
  const applied=jobs.filter(j=>reached(j)>=IDX.applied).length;
  const screens=jobs.filter(j=>reached(j)>=IDX.screen).length;
  const la=jobs.map(appDate).filter(Boolean).sort().pop();
  const gap=la?Math.round((new Date(t)-new Date(la))/864e5):null;
  const note=[];
  if(gap!=null)note.push(gap===0?'הגשת היום.':gap===1?'ההגשה האחרונה הייתה אתמול.':'עברו '+gap+' ימים מההגשה האחרונה.');
  if(applied>=5&&screens===0)note.push(applied+' הגשות, עדיין אפס שיחות מיון. הערוץ שמחזיר תשובות אצלך הוא פנייה ישירה לאדם, לא טופס.');
  else if(screens)note.push(screens+' הגיעו לשיחת מיון מתוך '+applied+' הגשות.');
  return '<div class="card brief"><h2>מה לעשות היום</h2>'
   +(list.length?'<ol class="bl">'+list.map(i=>{const A=BACT[i.k];
      return '<li class="'+i.k+'" data-b="'+i.kind+':'+esc(i.id)+':'+i.k+'">'
      +'<span class="bla r">'+A.r+'</span><span class="bla l">'+A.l+'</span>'
      +'<div class="blin"><div class="bltx"'+(i.kind==='j'?' data-id="':' data-co="')+esc(i.id)+'"><b>'+esc(i.t)+'</b><em>'+esc(i.s)+'</em></div>'
      +'<div class="blbtn"><button type="button" data-bact="r" title="'+A.r+'">✓</button><button type="button" data-bact="l" title="'+A.l+'">'+(i.k==='due'?'↷':'✕')+'</button></div></div></li>'}).join('')+'</ol>'
      +'<p class="blhint">בנייד: החלקה ימינה — '+'בוצע / הגשתי, החלקה שמאלה — מחר / לא רלוונטי.</p>'
    :'<p class="sub2">אין משרה שממתינה לפעולה ואין מעקב שעבר תאריך. זה הרגע לחפש חדשות או לפנות לאדם.</p>')
   +(note.length?'<p class="bnote">'+esc(note.join(' '))+'</p>':'')+'</div>';
}

const RCORE=/אינטגרצ|תצורה|CI\/CD|SCM|\bRF\b|מכ"ם|מכ״ם|רדאר|לוויינ|אמבדד|משובצ|תשתיות|\bOT\b|שירותי IT|ניווט|סיסטם|DevOps/i;
const RADJ=/אלקטרו|אופטיק|רחפנ|מל"ט|מל״ט|רובוטיק|תקשורת|בקרה|סימולצ|סונאר|חיישנ|מודיעין|סייבר|שבב|רשתות|בסיסי נתונים|לוחמה|אווירונאוט/i;
const ROFF=/חומרים|מיגון|מכניק|הינע|ייצור|לוגיסטיק|ייעוץ|דיגיטל|שיווק|נשק|תחמושת|הרכבת כוח אדם|השמה/i;
const RBANDS=[
 {k:'live',t:'בתהליך',c:'var(--accent)',sub:'הגשת או יש קשר פעיל. כאן לא בודקים מרחק.'},
 {k:'go',t:'הגש',c:'var(--good)',sub:'קרוב, בתחום, ויש לאן להגיש.'},
 {k:'chk',t:'שווה בדיקה',c:'var(--warn)',sub:'משהו אחד חסר: מרחק, תחום או משרה פתוחה.'},
 {k:'watch',t:'מעקב בלבד',c:'var(--grey)',sub:'אל תשקיע זמן עכשיו. תחזור אם תצוץ משרה.'},
 {k:'no',t:'פסול',c:'var(--bad)',sub:'אל תיגע. הסיבה כתובה בשורה.'},
 {k:'unk',t:'חסר מיקום',c:'var(--c3)',sub:'אי אפשר לדרג בלי עיר. צריך להשלים.'}];
const RNJ=n=>n===1?'משרה אחת פתוחה':n+' משרות פתוחות';
function rscore(c){
  const js=cjobs(c).filter(j=>j.stage!=='closed'), d=cdist(c), st=c.status||'חדש';
  if(RLIVE.indexOf(st)>=0){const w=[st];if(d!=null)w.push(d+' ק״מ');if(js.length)w.push(RNJ(js.length));
    if((c.contact||'').trim())w.push('יש איש קשר');return{n:null,band:'live',why:w,d,js}}
  if(/IAI|אלתא|Israel Aerospace/i.test(c.name||''))return{n:0,band:'no',why:['IAI — פסלת מראש'],d,js};
  if(st==='פסול'||st==='נסגר')return{n:0,band:'no',why:[(c.notes||'').replace(/^אופק [\d.]+: /,'').split('|')[0].trim().slice(0,90)||'סימנת פסול'],d,js};
  if(RULED.test(c.location||''))return{n:0,band:'no',why:[c.location+' — אזור שפסלת'],d,js};
  if(d==null)return{n:null,band:'unk',why:['אין עיר במאגר'],d,js};
  let n=40;const w=[];
  if(d<=30){n+=25;w.push(d+' ק״מ')}
  else if(d<=55){n+=18;w.push(d+' ק״מ')}
  else if(d<=70){n+=10;w.push(d+' ק״מ')}
  else if(d<=80){n+=2;w.push(d+' ק״מ, בגבול')}
  else if(d<=90){n-=16;w.push(d+' ק״מ, רחוק')}
  else return{n:0,band:'no',why:[d+' ק״מ — מעבר לרדיוס'],d,js};
  const dom=(c.domain||'')+' '+(c.name||'');
  if(RCORE.test(dom)){n+=20;w.push('תחום ליבה')}
  else if(RADJ.test(dom)){n+=12;w.push('תחום משיק')}
  else if(ROFF.test(dom)){n-=10;w.push('תחום רחוק ממך')}
  if(js.length){n+=18+Math.min(12,(js.length-1)*4);w.push(RNJ(js.length))}
  if((c.contact||'').trim()){n+=12;w.push('יש איש קשר')}
  if(st==='מעקב')w.push('סימנת למעקב');
  n=Math.max(0,Math.min(100,n));
  let band=n>=70?'go':n>=50?'chk':n>=30?'watch':'no';
  if(st==='מעקב'&&band==='go')band='chk';
  return{n,band,why:w,d,js};
}

   +'<label>תפקיד<input id="f-title" value="'+esc(v.title)+'" required></label>'
   +'<label>מיקום<input id="f-location" value="'+esc(v.location)+'"></label>'
   +'<label>שלב<select id="f-stage">'+STAGES.map(s=>'<option value="'+s.id+'"'+(s.id===v.stage?' selected':'')+'>'+s.label+'</option>').join('')+'</select></label>'
   +'<label class="wide">קישור למשרה<input id="f-url" dir="ltr" value="'+esc(v.url)+'" placeholder="https://"></label>'
   +'<label>הצעד הבא<input id="f-nextStep" value="'+esc(v.nextStep)+'"></label>'
   +'<label>תאריך לצעד הבא<input id="f-nextDate" type="date" dir="ltr" value="'+esc(v.nextDate)+'"></label>'
   +'<details class="adv"><summary>מתקדם</summary><div class="advgrid">'
   +'<label>מקור<input id="f-source" list="srcList" value="'+esc(v.source)+'"></label>'
   +'<label>סקטור<input id="f-sector" list="secList" value="'+esc(v.sector)+'"></label>'
   +'<label>תאריך פרסום<input id="f-posted" type="date" dir="ltr" value="'+esc(v.posted)+'"></label>'
   +'<label>התאמה<select id="f-fit">'+opt(FIT,v.fit)+'</select></label>'
   +'<label>תואר<select id="f-degree">'+opt(DEG,v.degree)+'</select></label>'
   +'<label>איש קשר או הפניה<input id="f-contact" value="'+esc(v.contact)+'"></label>'
   +'<label>גרסת קו״ח<select id="f-cv"><option value="">אוטומטי</option>'+Object.keys(CVN).map(k=>'<option value="'+k+'"'+(k===v.cv?' selected':'')+'>'+k+' · '+CVN[k]+'</option>').join('')+'</select></label>'
   +'</div></details>'
   +'<label class="wide">הערות<textarea id="f-notes">'+esc(v.notes)+'</textarea></label></div>'
   +'<div class="actions"><button type="submit" class="primary">שמור</button><button type="button" class="ghost" id="cancel">ביטול</button>'
   +(j&&j.url?'<a href="'+esc(j.url)+'" target="_blank" rel="noopener">פתח את המשרה</a>':'')
   +'<span class="sp"></span>'+(j?'<button type="button" class="danger" id="del">מחק</button>':'')+'</div></form>';
  $('modal').hidden=false;
  $('f-company').focus();
  $('cancel').onclick=closeModal;
  $('form').onsubmit=e=>{e.preventDefault();saveForm()};
  if(j)$('del').onclick=()=>{const b=$('del');if(b.dataset.arm){queue(()=>db.doc('jobs/'+j.id).delete());closeModal();toast('נמחקה')}else{b.dataset.arm='1';b.textContent='לחץ שוב כדי למחוק';clearTimeout(delT);delT=setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='מחק'}},4000)}};
}
function closeModal(){$('modal').hidden=true;$('modal').innerHTML='';editing=null}
function saveForm(){
  if(!db){toast('השמירה לא זמינה בתצוגה הזאת');return}
  const g=id=>$(id).value.trim();
  const old=editing?jobs.find(x=>x.id===editing):null;
  const id=editing||newId();
  const stage=g('f-stage');const t=today();
  const o=Object.assign({},old||{},{title:g('f-title'),company:g('f-company'),location:g('f-location'),source:g('f-source'),stage:stage,fit:g('f-fit'),degree:g('f-degree'),contact:g('f-contact'),sector:g('f-sector'),posted:g('f-posted'),url:g('f-url'),nextStep:g('f-nextStep'),cv:g('f-cv'),nextDate:g('f-nextDate'),notes:$('f-notes').value.trim()});
  delete o.id;
  if(!old)o.addedAt=t;
  applyStage(o,old?old.stage:null,stage);
  o.updatedAt=new Date().toISOString();
  queue(()=>db.doc('jobs/'+id).set(o));
  closeModal();toast('נשמר');
}
function applyStage(o,from,to){
  const i=IDX[to];
  if(typeof o.reached!=='number')o.reached=to==='closed'?0:i;
  if(to!=='closed'&&i>o.reached)o.reached=i;
  if(from!==to){o.history=(o.history||[]).concat([{s:to,d:today()}]);if(to==='applied'&&!o.appliedAt)o.appliedAt=today()}
}
function setStage(id,to,msg){
  const j=jobs.find(x=>x.id===id);if(!j||!db)return;
  const o=Object.assign({},j);delete o.id;o.stage=to;applyStage(o,j.stage,to);o.updatedAt=new Date().toISOString();
  queue(()=>db.doc('jobs/'+id).set(o));toast(msg);
}

if(location.hash&&location.hash!=='#focus'){try{history.replaceState(null,'',location.pathname+location.search+'#focus')}catch(e){}}
function setTab(k){if(k==='co')k='rank';if(k==='stats')k='focus';if(!TABS.includes(k))k='focus';if(location.hash.slice(1)===k){tab=k;render();return}location.hash=k}
document.addEventListener('click',e=>{
  const gb=e.target.closest('[data-grp]');if(gb){const g=GROUPS.find(x=>x.g===gb.dataset.grp);if(g)setTab(lastIn[g.g]||g.tabs[0]);return}
  const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const cf=e.target.closest('[data-cf]');if(cf){
    const t=cf.dataset.cf,v=cf.dataset.v;
    if(t==='near')cNear=!cNear; else if(t==='tier')cTier=(cTier===v?'':v); else if(t==='cat')cCat=(cCat===v?'':v); else if(t==='stat')cStat=(cStat===v?'':v);
    render();return}
  if(e.target.closest('[data-x]')){closeModal();return}
  const rbb=e.target.closest('[data-rkband]');if(rbb){rkOnly=rkOnly===rbb.dataset.rkband?'':rbb.dataset.rkband;render();return}
  if(e.target.id==='rkall'||e.target.id==='rknone'){const v=e.target.id==='rkall';RBANDS.forEach(b=>rkSet(b.k,v));render();return}
  const mg=e.target.closest('button[data-map]');if(mg){focusOnMap(mg.dataset.map);return}
  const rb=e.target.closest('button[data-co]');if(rb&&!$('modal').contains(rb)){openCo(rb.dataset.co);return}
  const cr=e.target.closest('tr[data-co]');if(cr&&!$('modal').contains(cr)){openCo(cr.dataset.co);return}
  const tri=e.target.closest('[data-tri]');if(tri){
    const id=tri.dataset.id,a=tri.dataset.tri;
    if(a==='keep')setStage(id,'checked','עברה לשלב: נבדקה');
    else if(a==='drop')setStage(id,'closed','נסגרה');
    else if(a==='next'){triIdx++;render()}
    else if(a==='prev'){triIdx=Math.max(0,triIdx-1);render()}
    return}
  const go=e.target.closest('[data-go]');if(go){
    const s=go.dataset.go,i=s.indexOf(':'),t=s.slice(0,i),v=s.slice(i+1);
    if(t==='flow'){flowStage=v;flowLimit=10;setTab('flow')}
    else{q='';fsrc=t==='src'?v:'';fsec=t==='sec'?v:'';ffit='';showClosed=false;setTab('all')}
    return}
  const fl=e.target.closest('[data-flow]');if(fl){flowStage=fl.dataset.flow;flowLimit=10;render();return}
  if(e.target.closest('#more')){flowLimit+=15;render();return}
  const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;sort=sort.k===k?{k:k,d:-sort.d}:{k:k,d:1};render();return}
  const bc=e.target.closest('.bltx[data-co]');if(bc&&!$('modal').contains(bc)){openCo(bc.dataset.co);return}
  const it=e.target.closest('[data-id]');if(it&&!$('modal').contains(it)){openModal(it.dataset.id)}
  if(e.target===$('modal'))closeModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('modal').hidden)closeModal();
  const tag=(e.target.tagName||'').toLowerCase();
  if(tab==='focus'&&$('modal').hidden&&tag!=='input'&&tag!=='textarea'&&tag!=='select'){
    const n=inbox().length;
    if(e.key==='ArrowLeft'&&triIdx<n-1){triIdx++;render()}
    else if(e.key==='ArrowRight'&&triIdx>0){triIdx--;render()}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}
  else if(e.target.id==='cq'){cq=e.target.value.trim().toLowerCase();render()}
  else if(e.target.id==='rkq'){rkQ=e.target.value;render()}});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='csort'){cSort=e.target.value;render();return}
  if(e.target.classList&&e.target.classList.contains('cstat')){
    const cid=e.target.dataset.co,v=e.target.value;
    coPatch(cid,{status:v,updatedAt:new Date().toISOString()});return}
  if(id==='fsrc'){fsrc=e.target.value;render()}
  else if(id==='fsec'){fsec=e.target.value;render()}
  else if(id==='ffit'){ffit=e.target.value;render()}
  else if(id==='showClosed'){showClosed=e.target.checked;render()}
});
$('add').onclick=()=>{if(!db){toast('ההוספה לא זמינה בתצוגה הזאת');return}openModal(null)};
function curTheme(){const t=document.documentElement.getAttribute('data-theme');if(t)return t;return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function syncThemeBtn(){$('theme').textContent=curTheme()==='dark'?'מצב בהיר':'מצב כהה'}
try{const sv=localStorage.getItem('jobs-theme2');if(sv==='light'||sv==='dark')document.documentElement.setAttribute('data-theme',sv)}catch(e){}
$('theme').onclick=()=>{const n=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('jobs-theme2',n)}catch(e){}syncThemeBtn()};
window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const h=$('mapcardwrap');
  if(h&&h.classList.contains('mapfull')){h.classList.remove('mapfull');document.body.classList.remove('noscroll');
    const b=$('mapfull');if(b)b.textContent='מסך מלא';setTimeout(()=>{_mapApi&&_mapApi.resize()},80)}});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1)||'focus';if($('modal')&&!$('modal').hidden)closeModal();if(TABS.includes(k)&&k!==tab){tab=k;render()}});
syncThemeBtn();
{const k=location.hash.slice(1);if(TABS.includes(k))tab=k}
render();
(window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)).then(d=>{
  db=d;
  if(!db){loaded=true;render();return}
  try{db.collection('companies').onSnapshot(s=>{cos=s.docs.map(x=>{const o=Object.assign({id:x.id},x.data());
    if(coPend[x.id])Object.assign(o,coPend[x.id]);return o});if(tab==='co'||tab==='rank'||tab==='map')render()},()=>{})}catch(e){}
  db.collection('jobs').onSnapshot(s=>{jobs=s.docs.map(x=>Object.assign({id:x.id},x.data()));loaded=true;render()},()=>{loaded=true;db=null;render()});
  try{db.collection('meta').onSnapshot(s=>{const d=s.docs.find(x=>x.id==='radar');meta=d?d.data():{};renderScan()},()=>{})}catch(e){}
}).catch(()=>{loaded=true;render()});
})();
</script>
